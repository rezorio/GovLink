<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GovLink</title>
    <meta name="theme-color" content="#0f6b5c" />
    <link rel="icon" href="/brand/govlink-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var d = localStorage.getItem('govlink-civic-density');
          document.documentElement.setAttribute(
            'data-civic-density',
            d === 'classic' ? 'classic' : 'alive',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-civic-density', 'alive');
        }
      })();
    </script>
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
