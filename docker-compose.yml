services:
  postgres:
    image: postgres:16-alpine
    container_name: govlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: govlink
      POSTGRES_PASSWORD: govlink
      POSTGRES_DB: govlink
    ports:
      # Fixed GovLink host port (default 5433). Avoids clashes with other apps on 5432.
      # Override only via .env: GOVLINK_PG_PORT=xxxx — keep DATABASE_URL in sync.
      - "${GOVLINK_PG_PORT:-5433}:5432"
    volumes:
      - govlink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govlink -d govlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: govlink-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-govlink}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-govlinksecret}
    ports:
      - "${GOVLINK_MINIO_PORT:-9000}:9000"
      - "${GOVLINK_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - govlink_minio:/data

volumes:
  govlink_pgdata:
  govlink_minio:
