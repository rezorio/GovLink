services:
  postgres:
    image: postgres:16-alpine
    container_name: govlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: govlink
      POSTGRES_PASSWORD: govlink
      POSTGRES_DB: govlink
    ports:
      # Fixed GovLink host port (default 5433). Avoids clashes with other apps on 5432.
      # Override only via .env: GOVLINK_PG_PORT=xxxx — keep DATABASE_URL in sync.
      - "${GOVLINK_PG_PORT:-5433}:5432"
    volumes:
      - govlink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govlink -d govlink"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  govlink_pgdata:
